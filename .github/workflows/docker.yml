name: Build and Push Docker Image

# 触发条件：
#   - 推送到 main/master
#   - 打 tag（v1.0.0 之类）
#   - PR 时只构建不推送，用于验证 Dockerfile 是否可用
#   - 手动触发
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名固定为 ghcr.io/<owner>/pt-tools
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. 静态检查 + 单元测试（不依赖第三方库，跑得很快）
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与 Dockerfile 基础镜像保持一致（p115client 需要 >=3.12）
          python-version: "3.12"

      - name: 单元测试
        run: python tests/run_all.py

      - name: proto 静态检查
        run: python tools/check_proto.py app/proto/clouddrive.proto

      - name: 后端静态检查
        run: python -u tools/check_backend.py

      - name: FastAPI 路由检查
        run: python tools/check_fastapi.py

      - name: 前端静态检查
        run: python tools/check_ui.py static/index.html

      # -----------------------------------------------------------------------
      # 冒烟测试：真实安装依赖并 import 应用。
      # 这一步是为了抓「静态检查抓不到、只有真正启动才报」的错误
      # （例如 FastAPI 把返回注解当 Pydantic 模型解析失败）。
      # -----------------------------------------------------------------------
      - name: 安装必需依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 编译 proto
        run: python tools/fetch_proto.py --out app/proto --offline

      - name: 应用启动冒烟测试
        run: python tests/test_smoke.py

  # ---------------------------------------------------------------------------
  # 1.5 依赖可解析性检查
  #     独立成 job 的价值：Docker 构建要几分钟，而 pip 解析只要几秒；
  #     依赖冲突能在这里被最快发现并定位到具体包。
  # ---------------------------------------------------------------------------
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必需依赖可解析
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt

      - name: 可选依赖可解析（115 相关，允许失败）
        continue-on-error: true
        run: pip install --dry-run -r requirements-optional.txt

  # ---------------------------------------------------------------------------
  # 2. 构建镜像并推送到 GHCR
  # ---------------------------------------------------------------------------
  build:
    needs: [test, deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 覆盖绝大多数 NAS / 服务器；
          # 需要 arm64（如树莓派）可取消下一行注释
          platforms: linux/amd64
          # platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已发布 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # 3. 运行验证：真正把容器跑起来并检查 /api/health
  #
  #    这是唯一能证明「镜像可用」的检查。之前的教训：
  #    静态检查全绿、镜像构建成功，但容器一启动就崩，用户才发现。
  # ---------------------------------------------------------------------------
  run-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像到本地（不推送）
        run: |
          docker build -t pttools:test .

      - name: 查看镜像内关键文件
        run: |
          docker run --rm --entrypoint sh pttools:test -c '
            echo "=== proto 生成文件 ==="
            ls -l /app/app/proto/ || true
            echo "=== BT 子服务二进制 ==="
            ls -l /app/btguard-bin/ 2>/dev/null || echo "(缺失)"
            /app/btguard-bin/bt-traffic-guard -version 2>/dev/null || echo "(无法执行)"
            echo "=== entrypoint 权限 ==="
            ls -l /app/docker/entrypoint.sh
            echo "=== 当前用户 ==="
            id
          '

      - name: 启动容器并等待健康
        run: |
          docker run -d --name pttools-test -p 8899:8899 pttools:test
          echo "--- 容器状态 ---"
          docker ps -a
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8899/api/health >/dev/null 2>&1; then
              ok=1
              echo "健康检查通过（第 ${i} 次尝试）"
              break
            fi
            # 容器已退出就不用再等
            if [ "$(docker inspect -f '{{.State.Running}}' pttools-test 2>/dev/null)" != "true" ]; then
              echo "!! 容器已退出，提前结束等待"
              break
            fi
            sleep 2
          done
          echo ""
          echo "=== 容器日志 ==="
          docker logs pttools-test || true
          echo ""
          echo "=== 健康检查结果 ==="
          curl -sS http://127.0.0.1:8899/api/health || true
          echo ""
          exit $((1 - ok))

      - name: 首页与关键接口可用性
        run: |
          set -e
          echo "--- GET / ---"
          curl -sS -o /tmp/index.html -w "HTTP %{http_code}, %{size_download} bytes\n" http://127.0.0.1:8899/
          grep -qi "PTtools" /tmp/index.html && echo "首页内容 OK"
          for p in /api/version /api/dashboard /api/rules /api/settings /api/tasks/live; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8899${p}")
            echo "GET ${p} -> ${code}"
            [ "$code" = "200" ] || { echo "!! ${p} 返回 ${code}"; exit 1; }
          done

      # 验证 BT 子服务整合：状态接口 + 反代是否真的把 Go 面板透出来了
      - name: BT 子服务整合验证
        run: |
          set -e
          echo "--- /api/btg/status ---"
          curl -sS http://127.0.0.1:8899/api/btg/status | tee /tmp/btg.json
          echo ""
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/btg.json'))
          assert d.get("available") is True, f"Go 二进制缺失: {d}"
          assert d.get("running") is True, f"子服务未运行: {d}"
          print("BT 子服务已就绪, pid =", d.get("pid"))
          PY
          echo "--- 反代 /btg/ ---"
          code=$(curl -sS -o /tmp/btg.html -w "%{http_code}" http://127.0.0.1:8899/btg/)
          echo "GET /btg/ -> ${code}"
          [ "$code" = "200" ] || { echo "!! 反代返回 ${code}"; exit 1; }
          echo "反代内容大小: $(wc -c < /tmp/btg.html) 字节"
          # 前端里的绝对路径必须被改写成 /btg/api/
          grep -q '/btg/api/' /tmp/btg.html && echo "路径重写 OK" || { echo "!! 路径未重写"; exit 1; }
          echo "--- 反代 API 透传 ---"
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8899/btg/api/status)
          echo "GET /btg/api/status -> ${code}"
          [ "$code" = "200" ] || { echo "!! 反代 API 返回 ${code}"; exit 1; }

      - name: 失败时输出完整诊断
        if: failure()
        run: |
          {
            echo '## 容器运行诊断'
            echo '### 容器状态'
            echo '```'
            docker ps -a || true
            docker inspect pttools-test 2>/dev/null | head -c 3000 || true
            echo '```'
            echo '### 容器日志'
            echo '```'
            docker logs pttools-test 2>&1 || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 清理
        if: always()
        run: docker rm -f pttools-test 2>/dev/null || true
